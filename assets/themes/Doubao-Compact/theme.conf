[Metadata]
Name=Doubao Compact
Version=1
Author=doubao-linux contributors
Description=豆包官方风格：紧凑、不透明、纯色候选栏。不使用 SVG 背景；ScaleWithDPI=False 避免边距被 DPI 放大后失控
ScaleWithDPI=False

[InputPanel]
NormalColor=#ffffff
HighlightCandidateColor=#ffffff
HighlightColor=#0A84FF
HighlightBackgroundColor=#0A84FF
PageButtonAlignment=Last Candidate

[InputPanel/Highlight]
Color=#0A84FF

[InputPanel/Highlight/Margin]
Left=6
Right=6
Top=1
Bottom=1

[InputPanel/TextMargin]
Left=6
Right=6
Top=1
Bottom=1

[InputPanel/ContentMargin]
Left=2
Right=2
Top=1
Bottom=1

[InputPanel/Background]
Color=#2b2b2b
BorderColor=#1a1a1a
BorderWidth=1

[InputPanel/Background/Margin]
Left=4
Right=4
Top=2
Bottom=2

[Menu/Background]
Color=#2b2b2b
BorderColor=#1a1a1a
BorderWidth=1

[Menu/Highlight]
Color=#0A84FF

[Menu/Separator]
Color=#3a3a3a
